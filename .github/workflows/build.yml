name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: toolchain
        run: |
          rustup target add aarch64-linux-android
          BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          "$BIN/aarch64-linux-android24-clang++" --version | head -2
      - name: upstream sources
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/DavidVentura/slimt.git /tmp/slimt
          git clone --depth 1 https://github.com/DavidVentura/translator-rs /tmp/src
      - name: build
        shell: bash
        working-directory: /tmp/src
        run: |
          set -o pipefail
          BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export SLIMT_SOURCE_DIR=/tmp/slimt
          export CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          export ANDROID_ABI=arm64-v8a
          export ANDROID_PLATFORM=android-24
          export CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang
          export CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++
          export AR_aarch64_linux_android=$BIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang
          cargo build --release --target aarch64-linux-android --features translate-cli --bin translate 2>&1 | tee /tmp/build.log | tail -20
      - name: diagnostics
        if: failure()
        shell: bash
        run: |
          echo '== first 15 lines =='
          head -15 /tmp/build.log || true
          echo '== error context =='
          grep -n -i -A8 'error:\|undefined reference\|cannot find\|CMake Error' /tmp/build.log | head -60 || true
      - name: collect
        if: always()
        shell: bash
        run: |
          D=/tmp/src/target/aarch64-linux-android/release
          SYS=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android
          mkdir -p out
          cp -v $D/translate out/ 2>/dev/null || true
          cp -v $SYS/libc++_shared.so out/ 2>/dev/null || true
          ls -l out
          echo "files=$(ls -A out | wc -l)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-out
          path: out
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: /tmp/build.log
