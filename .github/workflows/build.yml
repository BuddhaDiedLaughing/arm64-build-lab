name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: toolchain
        run: |
          rustup target add aarch64-linux-android
          echo "ndk: $ANDROID_NDK_HOME"
      - name: upstream sources
        run: |
          git clone --depth 1 https://github.com/DavidVentura/slimt.git /tmp/slimt
          git clone --depth 1 https://github.com/DavidVentura/translator-rs /tmp/src
      - name: build
        working-directory: /tmp/src
        run: |
          BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export SLIMT_SOURCE_DIR=/tmp/slimt
          export CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          export ANDROID_ABI=arm64-v8a
          export ANDROID_PLATFORM=android-24
          export CMAKE_GENERATOR=Ninja
          export CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang
          export CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++
          export AR_aarch64_linux_android=$BIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang
          cargo build --release --target aarch64-linux-android --lib -p translator 2>&1 | tail -80
      - name: collect
        if: always()
        run: |
          mkdir -p out
          cp -v /tmp/src/target/aarch64-linux-android/release/*.so out/ 2>/dev/null || true
          cp -v /tmp/src/target/aarch64-linux-android/release/*.a out/ 2>/dev/null || true
          ls -l out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-out
          path: out
          if-no-files-found: warn