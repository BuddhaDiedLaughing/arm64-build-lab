name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: toolchain
        run: |
          rustup target add aarch64-linux-android
          echo "ndk: $ANDROID_NDK_HOME"
          BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          "$BIN/aarch64-linux-android24-clang++" --version | head -2
      - name: upstream sources
        run: |
          git clone --depth 1 https://github.com/DavidVentura/slimt.git /tmp/slimt
          git clone --depth 1 https://github.com/DavidVentura/translator-rs /tmp/src
      - name: build
        shell: bash
        working-directory: /tmp/src
        run: |
          set -o pipefail
          BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export SLIMT_SOURCE_DIR=/tmp/slimt
          export CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          export ANDROID_ABI=arm64-v8a
          export ANDROID_PLATFORM=android-24
          export CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang
          export CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++
          export AR_aarch64_linux_android=$BIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang
          echo "cmake: $(cmake --version | head -1)"
          echo "ninja: $(command -v ninja || echo absent)"
          echo "make: $(command -v make || echo absent)"
          cargo build --release --target aarch64-linux-android --lib -p translator 2>&1 | tee /tmp/build.log | tail -80
      - name: cmake diagnostics
        if: failure()
        shell: bash
        run: |
          for f in $(find /tmp/src/target -name 'CMakeConfigureLog.yaml' 2>/dev/null | head -2); do
            echo "== $f"; grep -nE 'compiler|error|failed' "$f" | tail -25 | cut -c1-300
          done
      - name: collect
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp -v /tmp/src/target/aarch64-linux-android/release/*.so out/ 2>/dev/null || true
          cp -v /tmp/src/target/aarch64-linux-android/release/*.a out/ 2>/dev/null || true
          ls -l out
          echo "files=$(ls -A out | wc -l)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-out
          path: out
          if-no-files-found: warn
